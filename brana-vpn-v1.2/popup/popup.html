<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Brana VPN</title>
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app" id="app">
    <header class="top">
      <div class="brand">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="22" height="22"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#6366f1"/></linearGradient></defs><rect width="32" height="32" rx="8" fill="url(#lg)"/><path d="M16 5l9 3.5V15c0 6-4 10-9 12.5C11 25 7 21 7 15V8.5z" fill="#fff" opacity=".95"/><path d="M17.5 9l-6 8h4l-1 6.5 6-8.5h-4z" fill="#4f46e5"/></svg>
        </span>
        <b>Brana VPN</b>
      </div>
      <div class="top-right">
        <button class="hd-btn" id="coreBtn" aria-label="本地核心"><span class="sdot" id="coreDot"></span></button>
        <button class="hd-btn" id="openOptions" data-tip="控制中心" aria-label="控制中心"></button>
      </div>
    </header>

    <div class="notice hidden" id="notice" role="status"></div>

    <main class="main">
      <section class="hero">
        <div id="orbBox"></div>
        <div class="st-title" id="stTitle">未连接</div>
        <div class="st-sub" id="stSub"></div>
      </section>

      <section class="setup card hidden" id="setupCard"></section>
      <section class="route card hidden" id="routeCard"></section>

      <section class="regions-wrap hidden" id="regionsWrap">
        <div class="regions" id="regions"></div>
      </section>

      <section class="tiles hidden" id="tiles">
        <button class="tile" id="btnOptimize" data-tip="重新测试全部线路，切到最优"><span class="t-ico" data-ico="zap"></span><b class="t-lbl">优选</b></button>
        <button class="tile" id="btnNextIp" data-tip="换一个同地区的出口 IP"><span class="t-ico" data-ico="rotate"></span><b class="t-lbl">换 IP</b></button>
        <button class="tile" id="btnSpeed" data-tip="测试当前线路的下载速度"><span class="t-ico" data-ico="gauge"></span><b class="t-lbl">测速</b></button>
      </section>
    </main>

    <footer class="foot hidden" id="foot">
      <div id="scopeBox"></div>
      <button class="site-rule" id="siteRule"></button>
    </footer>
  </div>

  <div class="sheet-back" id="sheetBack"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div class="sheet-head"><h3 id="sheetTitle"></h3><div class="row" id="sheetActions"></div></div>
    <div class="sheet-tools" id="sheetTools"></div>
    <div class="sheet-list" id="sheetList"></div>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
